name: Test Action

on:
  push:
  pull_request:

jobs:
  basic:
    name: Basic lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          files: test/valid.conf

  context:
    name: Partial config with context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        continue-on-error: true
        with:
          files: test/server-block.conf
          context: http

  json-format:
    name: JSON output format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          files: test/valid.conf
          format: json

  multiple-files:
    name: Multiple files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        continue-on-error: true
        with:
          files: test/valid.conf test/server-block.conf

  no-cache:
    name: Cache disabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          files: test/valid.conf
          cache: false

  test-plugins:
    name: test-plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          command: test-plugins
          plugins: test/plugins
          fixtures: test/fixtures
          # Restore is off so that on warm runs actions/cache cannot populate
          # the directory before nginx-lint runs: the assertion below has to
          # see what nginx-lint wrote through the mount, nothing else.
          # lint-with-plugins covers the restore/save path.
          cache: false
      # Loading a WASM plugin is what makes the cache mount observable: the
      # compiled plugin must land in the directory the save step uploads.
      - name: Assert the WASM plugin cache was populated
        run: |
          if [ -z "$(ls -A "${RUNNER_TEMP}/nginx-lint-cache" 2>/dev/null)" ]; then
            echo "::error::${RUNNER_TEMP}/nginx-lint-cache is empty after test-plugins"
            exit 1
          fi
          find "${RUNNER_TEMP}/nginx-lint-cache" -type f

  test-plugins-missing-plugins:
    name: test-plugins without plugins input fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        id: run
        continue-on-error: true
        with:
          command: test-plugins
      - name: Assert the step failed
        if: steps.run.outcome != 'failure'
        run: |
          echo "::error::expected test-plugins without 'plugins' to fail"
          exit 1

  lint-with-plugins:
    name: Lint with a WASM plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          files: test/valid.conf
          plugins: test/plugins

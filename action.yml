name: "nginx-lint"
description: "Lint nginx configuration files using nginx-lint"
author: "walf443"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  command:
    description: "What to run: lint (lint nginx configuration files) or test-plugins (check that the WASM plugins in a directory work; requires nginx-lint 0.21.0 or newer)"
    required: false
    default: "lint"
  files:
    description: "Path to nginx configuration file(s) (space-separated). Required when command is lint"
    required: false
  version:
    description: "Version of nginx-lint to use (Docker image tag)"
    required: false
    default: "0.24.0@sha256:d1e855eb54d8e8c44d6e613fb1eaa5a9591d9f86db0031071a16f191aad7a062" # renovate: datasource=docker depName=ghcr.io/walf443/nginx-lint
  format:
    description: "Output format (github-actions or errorformat or json)"
    required: false
    default: "github-actions"
  config:
    description: "Path to .nginx-lint.toml configuration file"
    required: false
  context:
    description: "Parent context for partial config files (e.g., 'http,server')"
    required: false
  plugins:
    description: "Directory containing WASM plugins for custom lint rules. Required when command is test-plugins"
    required: false
  fixtures:
    description: "Directory of fixture cases (<case>/error/nginx.conf and/or <case>/expected/nginx.conf) to check the plugin against. test-plugins only; the plugins directory must then hold exactly one plugin"
    required: false
  allow-wasi-plugins:
    description: "Allow plugins that import WASI (needed for plugins built with toolchains such as Go). Can also be set as plugins.allow_wasi_plugins in .nginx-lint.toml"
    required: false
    default: "false"
  args:
    description: "Additional CLI arguments to pass to nginx-lint"
    required: false
  cache:
    description: "Cache compiled WASM plugins across CI runs using actions/cache. Requires an nginx-lint version with plugin cache support (newer than 0.15.0); older versions simply ignore the cache directory."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Restore WASM plugin cache
      if: inputs.cache != 'false'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/nginx-lint-cache
        # The key is unique per run: an exact key hit at restore time would
        # skip the save, so plugins compiled after the first save would never
        # be persisted. Content addressing and pruning of individual entries
        # happen inside the cache (keyed by plugin bytes and compiler
        # configuration), so the newest cache is always the right one to
        # restore and stale entries are just ignored.
        key: nginx-lint-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          nginx-lint-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-
          nginx-lint-cache-${{ runner.os }}-${{ runner.arch }}-

    - name: Run nginx-lint
      shell: bash
      run: |
        # Arguments that are valid for every subcommand (global flags).
        ARGS=""

        if [ -n "${{ inputs.config }}" ]; then
          ARGS="${ARGS} --config ${{ github.workspace }}/${{ inputs.config }}"
        fi

        if [ -n "${{ inputs.plugins }}" ]; then
          ARGS="${ARGS} --plugins ${{ github.workspace }}/${{ inputs.plugins }}"
        fi

        if [ "${{ inputs.allow-wasi-plugins }}" = "true" ]; then
          ARGS="${ARGS} --allow-wasi-plugins"
        fi

        case "${{ inputs.command }}" in
          lint)
            if [ -z "${{ inputs.files }}" ]; then
              echo "::error::The 'files' input is required when command is lint"
              exit 1
            fi

            if [ -n "${{ inputs.format }}" ]; then
              ARGS="${ARGS} --format ${{ inputs.format }}"
            fi

            if [ -n "${{ inputs.context }}" ]; then
              ARGS="${ARGS} --context ${{ inputs.context }}"
            fi

            # Build file arguments with workspace prefix
            FILES=""
            for file in ${{ inputs.files }}; do
              FILES="${FILES} ${{ github.workspace }}/${file}"
            done

            CMD="--no-color ${ARGS} ${{ inputs.args }} ${FILES}"
            ;;
          test-plugins)
            if [ -z "${{ inputs.plugins }}" ]; then
              echo "::error::The 'plugins' input is required when command is test-plugins"
              exit 1
            fi

            if [ -n "${{ inputs.fixtures }}" ]; then
              ARGS="${ARGS} --fixtures ${{ github.workspace }}/${{ inputs.fixtures }}"
            fi

            # test-plugins prints its own report, so format/context/files do
            # not apply here.
            CMD="test-plugins --no-color ${ARGS} ${{ inputs.args }}"
            ;;
          *)
            echo "::error::Unknown command '${{ inputs.command }}' (expected lint or test-plugins)"
            exit 1
            ;;
        esac

        # Persist the WASM plugin compilation cache outside the container.
        # nginx-lint resolves its cache root to $XDG_CACHE_HOME/nginx-lint,
        # so this works without the --cache-dir flag; versions without cache
        # support just ignore it.
        # TODO: once the default version supports --cache-dir, pass it
        # explicitly instead — it also overrides cache_dir in
        # .nginx-lint.toml, which silently bypasses this mount today.
        CACHE_DIR="${RUNNER_TEMP}/nginx-lint-cache"
        mkdir -p "${CACHE_DIR}"

        # Run as the host user so cache files written through the mount are
        # not root-owned on the host (actions/cache save and self-hosted
        # runner cleanup run as the unprivileged runner user).
        #
        # The working directory is the workspace so that test-plugins finds
        # the repository's .nginx-lint.toml (it searches from the current
        # directory, having no file to start from) and relative paths in
        # `args` resolve against the checkout.
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e XDG_CACHE_HOME=/nginx-lint-cache \
          -v "${CACHE_DIR}:/nginx-lint-cache" \
          -v "${{ github.workspace }}:${{ github.workspace }}" \
          -w "${{ github.workspace }}" \
          "ghcr.io/walf443/nginx-lint:${{ inputs.version }}" \
          ${CMD}

    - name: Check for compiled WASM plugins
      id: plugin-cache
      if: always() && inputs.cache != 'false'
      shell: bash
      run: |
        # Skip the save entirely when nothing was cached (no WASM plugins,
        # or an nginx-lint version without cache support).
        if [ -n "$(ls -A "${RUNNER_TEMP}/nginx-lint-cache" 2>/dev/null)" ]; then
          echo "dirty=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save WASM plugin cache
      # always(): for a linter, failing runs are the common case — the cold
      # compile must survive the fix-and-rerun loop.
      if: always() && steps.plugin-cache.outputs.dirty == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/nginx-lint-cache
        key: nginx-lint-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
